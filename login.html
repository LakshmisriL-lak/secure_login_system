{% extends "auth.html" %}{% block title %}Log in{% endblock %}{% block form %}
<h1>Welcome back</h1><p class="mut">Log in to your account</p>
{% include "_flashes.html" %}
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
 <label for="username">Username</label><input id="username" name="username" required autocomplete="username" autofocus>
 <label for="lp">Password</label><div class="pw"><input id="lp" name="password" type="password" required autocomplete="current-password"><button type="button" data-toggle="lp" aria-label="Show password">👁️</button></div>
 <button class="btn">Log in</button></form>
<p class="foot">No account? <a href="{{ url_for('register') }}">Create one</a></p>
{% endblock %}
